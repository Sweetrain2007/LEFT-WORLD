<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LEFT · 日志</title>
<link rel="stylesheet" href="assets/log/log.css">
<script defer src="assets/chat/return-to-chat.js"></script>
<link rel="stylesheet" href="assets/log/log-intro.css">
<script defer src="assets/log/config.js"></script>
<script defer src="assets/log/log-intro.js"></script>
<script defer src="assets/log/left-logs.js"></script>
<script defer src="assets/log/log.js"></script>
</head>
<body>
<section class="log-intro" id="log-intro" data-state="prompt" aria-label="日志开场">
<video class="memory-video" id="memory-video" playsinline preload="none" disablepictureinpicture disableremoteplayback aria-label="日志开场视频"></video>
<div class="memory-prompt" id="memory-prompt">
<h1>PLAY THE MEMORY?</h1>
<p>这段开场包含声音<br>建议佩戴耳机</p>
<div class="memory-actions"><button type="button" id="memory-play">▶ 播放开场</button><button type="button" id="memory-skip-prompt">跳过 →</button></div>
<p class="memory-error" id="memory-error" role="status" hidden>视频暂时无法播放，请重试或选择跳过。</p>
</div>
<button class="memory-skip" id="memory-skip" type="button">SKIP →</button>
</section>
<div id="log-content" hidden inert>
<div class="space-page">
<div class="space-utility"><span>个人空间 / 日志档案</span><a href="home.html" data-chat-return>← 返回聊天</a></div>
<header class="space-header"><img class="space-avatar" src="assets/left/left-avatar.jpg" alt="LEFT头像" width="64" height="64"><div><h1>LEFT'S SPACE</h1><p>LEFT 的个人空间</p></div><span class="space-mark" aria-hidden="true">L / SPACE</span></header>
<nav class="space-tabs" aria-label="空间栏目"><span>主页</span><a href="#left-log" aria-current="page">日志</a><span>留言板</span></nav>
<div class="space-columns"><aside class="space-sidebar" aria-label="日志目录"><section class="space-panel"><h2>日志档案</h2><p>作者：LEFT</p><p>日志：<span id="log-count">0</span> 篇</p><p>排列：最新在前</p></section><section class="space-panel"><h2>按年份浏览</h2><div id="log-years"></div></section></aside>
<main id="left-log" tabindex="-1"><div class="log-heading"><h2>日志</h2><span>按时间阅读 · 从晚到早</span></div><div id="log-list"></div><p class="log-empty" id="log-empty">暂无日志</p><div class="log-end">— 日志档案 —</div></main></div>
<footer class="space-footer">LEFT'S SPACE · 日志</footer></div>
<dialog class="listen-window" id="listen-window" aria-labelledby="listen-title"><div class="listen-titlebar"><h2 id="listen-title">LISTEN TO LEFT</h2><button type="button" id="listen-close" aria-label="关闭视频播放器">×</button></div><div class="listen-inner"><p id="listen-caption"></p><video id="letter-video" controls playsinline preload="metadata" aria-label="LEFT 读信视频"></video><p id="listen-error" role="status" hidden>视频暂时无法播放，请稍后重试。</p><div class="listen-status">LEFT'S SPACE / 读信</div></div></dialog>
</div><noscript><a href="home.html" data-chat-return>← 返回</a></noscript></body>
</html>
