<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重庆綦江 | LEFT's World</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#e3f2fd url("images/qijiang-tree-background.png") center/cover no-repeat fixed;color:#102c60;font-family:"Microsoft YaHei Light","Microsoft YaHei",sans-serif}
@font-face{font-family:"Weddingday";src:url("fonts/WeddingdayPersonalUseRegular-1Gvo0.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px;flex-wrap:wrap}.brand{font-family:"Weddingday",Georgia,serif;font-size:24px;margin:0}a{color:inherit;text-underline-offset:5px;font-size:14px}a:focus-visible{outline:2px solid #31547c;outline-offset:6px}
main{width:calc(100% - 64px);margin:24px auto 32px;min-height:calc(100svh - 140px);display:flex;flex-direction:column}.eyebrow{font-size:11px;letter-spacing:.2em;color:#365778}h1{font-weight:300;font-size:clamp(25px,5vw,40px);margin:16px 0 28px}.story-space{flex:1;min-height:280px;border-top:1px solid rgba(255,255,255,.7);padding-top:20px}.story-space p{font-size:14px;color:#365778;letter-spacing:.08em}.journey-nav{display:flex;justify-content:space-between;gap:20px;margin-top:40px;flex-wrap:wrap}
@media(max-width:600px){main{width:calc(100% - 40px)}}
/* 原句下方展示相册。 */
.story-space{display:flex;flex-direction:column;gap:24px;align-items:flex-start}
.left-profile{width:100%;max-width:420px;margin-top:0;padding:28px 30px;border:1px solid rgba(255,255,255,.65);border-radius:18px;background:rgba(247,251,255,.94);color:#10283f;box-shadow:0 8px 28px rgba(20,46,77,.10)}
.left-profile h2{margin:0 0 22px;font-family:"Microsoft JhengHei","Microsoft YaHei",sans-serif;font-size:23px;font-weight:400;letter-spacing:.04em}
.left-profile dl{margin:0}
.left-profile dl>div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;padding:11px 0;border-bottom:1px solid rgba(48,76,107,.15);font-size:14px;line-height:1.7}
.left-profile dl>div:last-child{border-bottom:0}
.left-profile dt{color:#29445e}.left-profile dd{margin:0;color:#10283f;overflow-wrap:anywhere}
@media(max-width:760px){.story-space{grid-template-columns:1fr;gap:24px}.left-profile{width:100%;max-width:420px;justify-self:start;margin-top:0;padding:24px}.left-profile dl>div{gap:12px}}

/* 相册在页面中央显示。 */
.profile-and-album{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(24px,4vw,64px);width:100%;align-items:start}
.memory-album{width:100%;max-width:820px;justify-self:center;min-width:0;border-radius:14px}
.album-view{position:relative;aspect-ratio:3/2;background:#102743;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(16,40,63,.2)}
.album-slide{width:100%;height:100%}.album-slide[hidden]{display:none}
.album-slide img,.album-slide video{display:block;width:100%;height:100%;object-fit:contain}
.album-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:52px;padding:0;border:1px solid rgba(255,255,255,.6);border-radius:12px;background:rgba(15,36,66,.72);color:white;font:34px/1 Arial,sans-serif;cursor:pointer}
.album-prev{left:10px}.album-next{right:10px}
.album-arrow:hover{background:rgba(15,36,66,.95)}.album-arrow[aria-disabled="true"]{opacity:.3;cursor:default}
.album-arrow:focus-visible,.memory-album:focus-visible{outline:3px solid #fff;outline-offset:3px}
.album-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;color:#10283f;background:rgba(247,251,255,.94);border-radius:0 0 12px 12px;font-size:13px;line-height:1.6}
@media(max-width:900px){.profile-and-album{grid-template-columns:1fr;gap:28px}.memory-album{justify-self:center}}
@media(max-width:480px){.album-arrow{width:34px;height:44px}.album-prev{left:6px}.album-next{right:6px}}
</style></head><body><header><p class="brand">LEFT's World</p><a href="home.html#journey-title">← 返回主页路线</a></header>
<main><p class="eyebrow">THE JOURNEY / 01</p><h1>重庆綦江</h1><section class="story-space" aria-label="地点故事"><p>“我想出去走一走，看看这个大世界”</p><div class="profile-and-album">
<section class="memory-album" aria-label="小小航的记忆碎片" aria-roledescription="轮播相册" tabindex="0">
  <div class="album-view">
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第1张，共16张：封面">
      <img src="images/qijiang-album-cover-v2.jpg" alt="小小航的记忆碎片，蓝色相册封面">
    </div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第2张，共16张：视频" hidden>
      <video controls playsinline preload="metadata" aria-label="小小航的记忆视频"><source src="videos/qijiang-memory.mp4" type="video/mp4">你的浏览器不支持视频播放。</video>
    </div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第3张，共16张：照片" hidden>
      <img src="images/qijiang-album-photo.jpg" alt="相册照片：戴黑色帽子的左航" loading="lazy">
    </div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第4张，共16张：照片" hidden><img src="images/qijiang-4a14f3d98683dadef48f34aa1c57dc0e.png" alt="记忆相册照片 2" loading="lazy"></div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第5张，共16张：照片" hidden><img src="images/qijiang-cb6bff0aa98630e5994e8df80d94b04b.jpg" alt="记忆相册照片 3" loading="lazy"></div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第6张，共16张：照片" hidden><img src="images/qijiang-36ba34d90a9fa77bec8cc1a57594066b.jpg" alt="记忆相册照片 4" loading="lazy"></div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第7张，共16张：照片" hidden><img src="images/qijiang-60e4f43388a83a24d907d66798943d2b.jpg" alt="记忆相册照片 5" loading="lazy"></div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第8张，共16张：照片" hidden><img src="images/qijiang-910208c629aa59b92d004ba9148dbcf7.jpg" alt="记忆相册照片 6" loading="lazy"></div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第9张，共16张：照片" hidden><img src="images/qijiang-d0253547fbd3ff0a7d0285c8f0f886a5.jpg" alt="记忆相册照片 7" loading="lazy"></div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第10张，共16张：照片" hidden><img src="images/qijiang-69cbc33f2d4d304fe16a63a87c8990d2.jpg" alt="记忆相册照片 8" loading="lazy"></div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第11张，共16张：照片" hidden><img src="images/qijiang-f9eaa4879241d3bcecdfebf471c2e993.jpg" alt="记忆相册照片 9" loading="lazy"></div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第12张，共16张：照片" hidden><img src="images/qijiang-db12fb9be15f45aa6dafa50f30d686b2.jpg" alt="记忆相册照片 10" loading="lazy"></div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第13张，共16张：照片" hidden><img src="images/qijiang-141f66464bdc478f47fc38763120e821.jpg" alt="记忆相册照片 11" loading="lazy"></div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第14张，共16张：照片" hidden><img src="images/qijiang-7f3e573539942c24a3c744a8d0fa8922.jpg" alt="记忆相册照片 12" loading="lazy"></div>
    <div class="album-slide" role="group" aria-roledescription="幻灯片" aria-label="第15张，共16张：照片" hidden><img src="images/qijiang-87c80ded5fe09b61948c47afc1442656.jpg" alt="记忆相册照片 13" loading="lazy"></div>
<div class="album-slide" data-label="尾页" role="group" aria-roledescription="幻灯片" aria-label="第16张，共16张：尾页" hidden><img src="images/qijiang-album-end-v2.png" alt="蓝色相册尾页" loading="lazy"></div>
    <button type="button" class="album-arrow album-prev" aria-label="上一张" aria-disabled="true">‹</button>
    <button type="button" class="album-arrow album-next" aria-label="下一张" aria-disabled="false">›</button>
  </div>
  <div class="album-footer"><span>小小航的记忆碎片</span><span class="album-status" aria-live="polite" aria-atomic="true">1 / 16 · 封面</span></div>
</section></div></section><nav class="journey-nav" aria-label="其他地点"><span></span><a href="changjiang.html">重庆南岸·长江国际 →</a></nav></main><script>(() => {
  const album = document.querySelector(".memory-album");
  const slides = Array.from(album.querySelectorAll(".album-slide"));
  const prev = album.querySelector(".album-prev");
  const next = album.querySelector(".album-next");
  const status = album.querySelector(".album-status");
  const names = slides.map((slide, index) => slide.getAttribute("data-label") || (index === 0 ? "封面" : (slide.querySelector("video") ? "视频" : "照片")));
  let current = 0;
  function show(index) {
    if (index < 0 || index >= slides.length || index === current) return;
    slides[current].querySelectorAll("video").forEach(video => video.pause());
    current = index;
    slides.forEach((slide, i) => { slide.hidden = i !== current; });
    prev.setAttribute("aria-disabled", String(current === 0));
    next.setAttribute("aria-disabled", String(current === slides.length - 1));
    status.textContent = (current + 1) + " / " + slides.length + " · " + names[current];
  }
  prev.addEventListener("click", () => show(current - 1));
  next.addEventListener("click", () => show(current + 1));
  album.addEventListener("keydown", event => {
    if (event.target.closest("video")) return;
    if (event.key === "ArrowLeft") { event.preventDefault(); show(current - 1); }
    if (event.key === "ArrowRight") { event.preventDefault(); show(current + 1); }
  });
})();</script></body></html>
