<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LEFT'S WORLD · 聊天</title>
<link rel="stylesheet" href="assets/chat/chat.css">
<link rel="stylesheet" href="assets/chat/mobile-chat.css">
<script src="assets/chat/legacy-routes.js"></script>
<script defer src="assets/chat/config.js"></script>
<script defer src="assets/chat/chat.js"></script>
<link rel="stylesheet" href="assets/chat/profile-popup.css">
<script defer src="assets/chat/profile-popup.js"></script>
</head>
<body>
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="chat" viewBox="0 0 16 16"><path d="M1 2h14v10H7l-4 3v-3H1z" fill="#ecf6ff" stroke="#19488a"/><path d="M4 5h8M4 8h6" stroke="#5686bd"/></symbol>
<symbol id="folder" viewBox="0 0 16 16"><path d="M1 3h6l2 2h6v9H1z" fill="#e2bd61" stroke="#8c7130"/><path d="M2 6h12v6H2" fill="#ffe49a"/></symbol>
<symbol id="pin" viewBox="0 0 16 16"><path d="M5 1h6v2h2v6h-2v2H9v4H7v-4H5V9H3V3h2z" fill="#7098c6" stroke="#365878"/><path d="M6 4h4v4H6z" fill="#f1f6ff"/></symbol>
<symbol id="music" viewBox="0 0 16 16"><path d="M6 2h8v9h-2V5H8v8H6zM2 11h5v3H2zM10 9h4v3h-4z" fill="#496f9e"/></symbol>
<symbol id="photo" viewBox="0 0 16 16"><path d="M1 2h14v12H1z" fill="#fff" stroke="#637c92"/><path d="M3 10l3-4 3 4 2-2 2 4H3z" fill="#78a69c"/><path d="M11 4h2v2h-2z" fill="#dfc370"/></symbol>
<symbol id="face" viewBox="0 0 16 16"><path d="M4 1h8v2h2v10h-2v2H4v-2H2V3h2z" fill="#ffdf80" stroke="#9b864d"/><path d="M5 5v2m5-2v2M5 10v1h5v-1" fill="none" stroke="#594e34"/></symbol>
</svg>
<main class="desktop" aria-label="LEFT'S WORLD 聊天工作区"><div class="chat-home">
<section class="xp-window contact-window" aria-labelledby="contacts-title">
<header class="title-bar"><svg class="pixel-icon" aria-hidden="true"><use href="#chat"/></svg><h1 id="contacts-title">LEFT'S WORLD</h1><div class="window-controls" aria-hidden="true"><span class="minimize"></span><span class="close"></span></div></header>
<div class="contact-heading"><strong>联系人</strong><span><i class="online-dot"></i> 在线</span></div>
<div class="contact-tabs"><span>好友</span></div>
<div class="contact-list" aria-label="好友列表">
<div class="group-label"><span aria-hidden="true">▾</span><svg class="pixel-icon" aria-hidden="true"><use href="#folder"/></svg>我的好友 <small>[1/1]</small></div>
<button type="button" class="contact-item selected" id="left-contact" aria-pressed="true" aria-controls="left-chat"><span class="avatar-frame"><img data-left-avatar alt="" draggable="false"><i class="online-dot"></i></span><span class="contact-name">LEFT <small>在线</small></span></button>
</div>
<footer class="window-status"><svg class="pixel-icon" aria-hidden="true"><use href="#chat"/></svg>1 位联系人<span class="resize-grip" aria-hidden="true"></span></footer>
</section>
<section class="xp-window chat-window" id="left-chat" aria-labelledby="chat-title">
<header class="title-bar"><svg class="pixel-icon" aria-hidden="true"><use href="#chat"/></svg><h2 id="chat-title">LEFT</h2><div class="window-controls" aria-hidden="true"><span class="minimize"></span><span class="maximize"></span><span class="close"></span></div></header>
<header class="chat-header"><i class="online-dot"></i><strong>LEFT</strong><span>在线</span></header>
<div class="chat-body">
<div class="conversation">
<section class="chat-history" aria-label="聊天记录"><div class="history-heading">与 LEFT 聊天</div><div class="message-list" role="log" aria-live="polite" aria-label="消息列表"></div></section>
<form class="chat-input" id="chat-input">
<div class="input-toolbar" role="group" aria-label="输入工具">
<button type="button" class="tool-button" disabled title="文字格式（尚未开放）" aria-label="文字格式"><b class="text-tool">A</b></button><span class="toolbar-separator" aria-hidden="true"></span>
<button type="button" class="tool-button" disabled title="表情（尚未开放）" aria-label="表情"><svg class="pixel-icon" aria-hidden="true"><use href="#face"/></svg></button>
<button type="button" class="tool-button" disabled title="照片（尚未开放）" aria-label="照片"><svg class="pixel-icon" aria-hidden="true"><use href="#photo"/></svg></button>
</div>
<label class="sr-only" for="message-draft">消息输入框</label><textarea id="message-draft" aria-describedby="send-status" spellcheck="false"></textarea>
<div class="input-actions"><span id="send-status">发送功能暂未开放</span><button class="xp-button" type="submit" disabled>发送(S)</button></div>
</form>
</div>
<aside class="profile-sidebar" aria-label="LEFT 信息与功能">
<div class="sidebar-heading">好友资料</div>
<button type="button" class="profile-avatar" id="profile-avatar" aria-label="打开 LEFT 个人资料" title="LEFT 个人资料"><img data-left-avatar alt="LEFT 头像" draggable="false"></button>
<strong class="profile-name">LEFT</strong><span class="profile-status"><i class="online-dot"></i> 在线</span>
<div class="sidebar-divider"></div>
<div class="feature-list" aria-label="共享功能">
<button type="button" class="feature-button" data-share="location"><svg class="pixel-icon" aria-hidden="true"><use href="#pin"/></svg>共享位置</button>
<button type="button" class="feature-button" data-share="music"><svg class="pixel-icon" aria-hidden="true"><use href="#music"/></svg>分享音乐</button>
<button type="button" class="feature-button" disabled><svg class="pixel-icon" aria-hidden="true"><use href="#photo"/></svg>发送照片</button>
</div>
</aside>
</div>
<footer class="window-status">LEFT'S WORLD<span class="resize-grip" aria-hidden="true"></span></footer>
</section>
</div></main>

<main class="mobile-chat" aria-label="LEFT’S WORLD 手机聊天">
  <header class="mobile-titlebar">
    <a href="index.html" class="mobile-back" aria-label="返回开屏">‹ 返回</a>
    <h1>LEFT</h1><span class="mobile-signal" aria-hidden="true">▂▄▆</span>
  </header>
  <div class="mobile-contact" id="mobile-contact">
    <button type="button" class="mobile-avatar" id="mobile-profile-avatar" aria-label="打开 LEFT 个人资料"><img data-left-avatar alt="LEFT 头像" draggable="false"></button>
    <div><strong>LEFT</strong><span class="mobile-online"><i class="online-dot"></i> 在线</span></div>
    <span class="mobile-notice" aria-hidden="true"><svg class="pixel-icon"><use href="#chat"/></svg>新消息</span>
    <span class="mobile-brand">LEFT’S WORLD</span>
  </div>
  <div class="mobile-history-label">消息记录</div>
  <section class="mobile-history" aria-label="与 LEFT 聊天">
    <div class="message-list mobile-message-list" data-mobile-messages role="log" aria-live="polite" aria-label="LEFT 的消息"></div>
  </section>
  <form class="mobile-composer" id="mobile-chat-input">
    <div class="mobile-tools" role="group" aria-label="输入工具">
      <button type="button" disabled><svg class="pixel-icon" aria-hidden="true"><use href="#face"/></svg>表情</button>
      <button type="button" disabled><svg class="pixel-icon" aria-hidden="true"><use href="#photo"/></svg>图片</button>
      <span>发送功能暂未开放</span>
    </div>
    <div class="mobile-draft-row"><label class="sr-only" for="mobile-message-draft">消息输入框</label><textarea id="mobile-message-draft" rows="2" spellcheck="false" aria-label="消息草稿"></textarea><button type="submit" disabled>发送</button></div>
  </form>
  <nav class="mobile-sharebar" aria-label="共享功能">
    <button type="button" data-share="location"><svg class="pixel-icon" aria-hidden="true"><use href="#pin"/></svg>共享位置</button>
    <button type="button" data-share="music"><svg class="pixel-icon" aria-hidden="true"><use href="#music"/></svg>分享音乐</button>
    <button type="button" disabled><svg class="pixel-icon" aria-hidden="true"><use href="#photo"/></svg>发送照片</button>
  </nav>
</main>
</body></html>
