<!DOCTYPE html>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:#173451;font-family:"Microsoft YaHei Light","Microsoft YaHei",sans-serif}
.gallery-wrap{width:min(1200px,calc(100% - 48px));margin:0 auto;padding:28px 0 48px}
.back{display:inline-block;color:inherit;font-size:14px;text-underline-offset:5px;margin-bottom:28px}
.poster-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 24px;align-items:start}
.poster{display:block;min-width:0;border-radius:6px;transition:transform .2s ease}
.poster img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:contain;box-shadow:0 5px 18px rgba(16,44,96,.1);border-radius:6px}
.poster:hover{transform:translateY(-4px)}
a:focus-visible{outline:2px solid #31547c;outline-offset:6px}
@media(max-width:600px){.gallery-wrap{width:calc(100% - 24px);padding-top:20px}.poster-grid{gap:18px 10px}}
@media(prefers-reduced-motion:reduce){.poster{transition:none}.poster:hover{transform:none}}
</style>
</head>
